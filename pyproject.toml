[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentpgo"
version = "0.1.0"
description = "Profile-guided optimization for AI agents"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13",
  "argon2-cffi>=23.1",
  "boto3>=1.35",
  "fastapi>=0.115",
  "pydantic>=2.7",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pyyaml>=6.0",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.scripts]
agentpgo = "cli.agentpgo_cli:main"

[tool.setuptools.packages.find]
include = ["apps*", "cli*", "migrations*", "packages*", "services*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
