name: agentpgo

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agentpgo
      POSTGRES_USER: agentpgo
      POSTGRES_PASSWORD: agentpgo
    volumes:
      - agentpgo-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentpgo -d agentpgo"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://agentpgo:agentpgo@postgres:5432/agentpgo
    ports:
      - "${AGENTPGO_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["python", "-m", "services.worker.main", "--max-iterations", "1"]
    environment:
      DATABASE_URL: postgresql+psycopg://agentpgo:agentpgo@postgres:5432/agentpgo
      SQS_QUEUE_URL: ""
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  agentpgo-postgres:
